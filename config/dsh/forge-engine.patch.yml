# ForgeEngine 专用 DSH 预设（2026-09-28 由会话根据过往任务总结）
#
# 包含两部分：
#   ① Agent 预设 `forge-engine` —— 精简工具集 + 项目铁律 + **不挂子代理**（子代理缓存命中率低、费钱、易与手工编辑冲突）
#   ② 权限预设 `forge-engine`（**覆盖补丁**，非插入）—— 覆盖部署里 `permission` 行的 config，把「沙箱 danger-full-access + 审批 never」捆成一个具名档，并设为新会话默认（`defaultPreset`）
#
# 安装方式：
#   A. Web 图形界面：设置 → 插件/配方（plugin manager）→ 导入本文件的 `plugins` 段（等价于 profile patch 插入）
#   B. 手工：把下面 `- insert:` 段按 profile patch 的插入语义加进当前 profile，重启 dsh
# 注意：`AGENTS.md` 由 dsh-agent-instructions 自动注入 ⇒ 本预设只补「AGENTS.md 里没有的」会话习惯，不重复抄铁律。

- insert:
    - id: preset-forge-engine
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: forge-engine
        name: ForgeEngine
        description: C++20 + Vulkan 项目：精简工具、禁子代理、本地缓存优先
        order: 0
        plugins:
          # ── 人格：项目上下文 + 会话习惯（AGENTS.md 之外的部分）────────────────
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are the ForgeEngine project's coding agent, powered by the {{model}} model. 默认中文、回答简短、先结论后证据。
              suffix: |
                工作目录：{{cwd}}（C++20 + Vulkan 1.4 + CMake/vcpkg + VS2026/v145；单 TU `Main.cpp` 聚合）。
                权威细则在仓库里，按需读：`docs\chatbox-docs\07_系统提示词.md`（写法/命名/传参/排版）、`06_经验教训.md`（历史坑）、`08_工作流.md`（流程与落点）。AGENTS.md 与本段冲突时以 AGENTS.md 为准。

                会话习惯（过往任务总结，务必遵守）：
                - **不派子代理做源码改造**：子代理缓存命中率低（重复读盘/重复探查/重复踩坑）、费钱，且容易与用户的手工编辑互相覆盖；默认由主会话自己动手（仅当用户明确要求，或工作互相独立且体量极大时才考虑）。已启动的子代理中途无法取消 ⇒ 启动前想清楚；它跑着时不要同时改同一批文件。
                - **改 `src\code` 后按闸门自证**：编译 Release + Debug 各 0 error / 0 warning；管线相关必跑探针 `build\temp\work\gen-equiv.ps1` 的 `STRICT_DIFF=0`（并看 `MSAA_BAD` / `ASSERT_BAD` / `CARD2_BAD`）；运行验证要**正常退出**（关闭窗口 / `EXITCODE=0`）后再看审计行与句柄泄漏统计，强杀的结果不算证据。
                - **能用 VS 官方能力就别自己造脚本**：构建 / 错误列表 / 跳转 / 保存 / 调试 / Find-All-References 抽查走 DTE 桥 `config\tool\vs-bridge\vs.ps1`（必须用 Windows PowerShell 5.1 调，不能用 pwsh）；全仓统计 / 批量比对 / 格式与覆盖率校验才写脚本。
                - **需要人工操作的验证**（窗口 / 焦点 / resize / 试玩 / 肉眼判读）默认请用户执行，不自行上自动化。
                - **Obsidian 库**（`E:\data\lib\文档\电脑文本库\自制游戏\铸造`）由主会话负责写：代码规范 / 目录约定 / 架构决策 / 工具落点变更默认同步进库（库内 LF、无 BOM、尾无换行）；子代理写不了库时出交接件 `build\temp\work\`。
                - **本机沙箱限制**：`workspace-write` 在本机不可用（`SetNamedSecurityInfoW failed (Win32 5)`）⇒ 文件策略请用 `danger-full-access`；切模式后若报此错，先切回 `danger-full-access` 再干活。
                - 一次只做用户要的那件事；破坏性动作（清理 / 删除 / 覆盖）先问；查到手边代码有疑似 bug 时**先报后改**，不静默顺手修。

          # ── 项目说明注入（AGENTS.md 等）────────────────────────────────────
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          # ── 工具：只留这个项目真正用得到的 ────────────────────────────────
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'

          # ── 按本项目特点补的（长任务 / 大输出 / 变更审计 / 超时 / 循环卫生）──
          - id: tool-cordis
            name: '@deepseek-ai/dsh-tool-cordis'                 # 只读查询已装 DSH 插件（配预设/查配置时用）
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'                 # 长任务目标：跨多轮持续推进
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: tool-call-timeout-policy
            name: '@deepseek-ai/dsh-tool-call-timeout-policy'    # 工具调用协作式超时 + 清晰错误
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'                # 每步带时钟（日志/“最近几分钟”判断）
          - id: repeat-tool-reminder
            name: '@deepseek-ai/dsh-repeat-tool-reminder'        # 重复同一工具调用时提醒模型（防原地打转）
          - id: workspace-changes
            name: '@deepseek-ai/dsh-workspace-changes'           # 每轮用 git 工作树快照汇总改动文件（改完自查）
          - id: skill-office
            name: '@deepseek-ai/dsh-skill-office'                # Word/PPT/Excel 指令（技能，按需加载）

          # ── 压缩：本项目会话很长，阈值收紧（默认 8192/4096/1024）───────────
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 4096
                  headChars: 2048
                  tailChars: 768

          # ── 刻意不挂（相对 standard 的裁剪 / 与已有机制冲突的）────────────
          #  delegation 组（tool-subagent / subagent_fork / workflow / ralph）：禁子代理，省缓存与成本
          #  planning 组（plan-mode）：本项目不用 plan mode，省约 2KB 常驻提示词
          #  tool-plugin-manager：保持关闭；要装/改预设请在 Web 界面或在 profile patch 里做
          #  spill / spill-local / spill-policy：与上面的 compaction-tool-result-pruner 是两套"大结果保留"机制，别叠
          #  experimental-auto-review：每次工具调用前多一次模型审查 ⇒ 与"省成本"冲突
          #  experimental-agent-team*：团队 / teammate，与"不派子代理"冲突
          #  tool-bash / tool-bash-persistent：Windows 走 pwsh
          #  tool-pwsh-persistent：本项目命令都是一次性，持久 shell 的状态反而会带来意外
          #  tool-str-replace-editor：已有 fs 的 read/write/edit
          #  office-to-pdf（需 LibreOffice）· experimental-voice-input / speech-to-text · skill-badge：本项目用不到
          #
          # ── 宿主已挂载、**无需重复**的（我核过 web bundle 的插件清单）──────
          #  fs-local + fs-observation-policy（改前必读的防护）· file-reference + file-reference-local（@文件补全）
          #  workspace / workspace-files / workspace-controller · message-feedback（消息点赞点踩）
          #  host-open-in-app（在 VS 等外部程序打开）· attachment / attachment-local（附件）
          #  session-stats / session-turn-outline（会话统计与轮次大纲）· client-ui-sidebar-terminal（右侧终端页）

# ② 权限预设：覆盖部署里已有的 `permission` 行（组合后 profile 里是 `- id: permission` /
#    `name: '@deepseek-ai/dsh-permission-presets'`；行 id 可用 `dsh --profile web --dump-config` 随时复查）。
#    注意：`config` 整体替换、不深合并 ⇒ 内置三项必须原样重列，漏写等于删掉。
#    本机 `workspace-write` 的 ACL 建立会失败（SetNamedSecurityInfoW Win32 5）⇒ 新会话默认给全权。
- id: permission
  name: '@deepseek-ai/dsh-permission-presets'
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        sandbox: danger-full-access
        approval: never
      forge-engine:
        sandbox: danger-full-access
        approval: never
        name: ForgeEngine（本机可用）
        description: 沙箱 danger-full-access + 审批 never（本机 workspace-write 的 ACL 建立会失败）
    defaultPreset: forge-engine